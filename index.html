<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重庆楼宇线缆可视化 Demo</title>

  <!-- Leaflet CSS + JS (CDN, UMD global L) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin="" />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""></script>

  <!-- Three.js via CDN ESM. Modules import from the bare specifier "three",
       resolved here by the import map. No npm, no build step. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main id="app">
    <!-- MAP VIEW: Leaflet 2D map with building markers. -->
    <section id="map-view" class="view view--map" aria-label="楼宇地图视图"></section>

    <!-- BUILDING VIEW: interior per-floor view. Hidden by default. -->
    <section id="building-view" class="view view--building view--hidden" aria-label="楼宇内部视图">
      <!-- Top bar: building name + back to map. -->
      <header class="bld-topbar">
        <span class="bld-name" id="bld-name">—</span>
        <button type="button" class="btn-back" id="btn-back">← 返回地图</button>
      </header>

      <div class="bld-body">
        <!-- Left ~60%: floor pager + per-floor cable panel grouped by direction. -->
        <div class="bld-left">
          <nav class="floor-pager" id="floor-pager" aria-label="楼层切换">
            <button type="button" class="pager-btn" id="pager-prev" aria-label="上一楼层">‹ 上一楼</button>
            <select id="floor-select" class="floor-select" aria-label="选择楼层"></select>
            <button type="button" class="pager-btn" id="pager-next" aria-label="下一楼层">下一楼 ›</button>
          </nav>
          <div class="floor-panel" id="floor-panel"></div>
        </div>

        <!-- Right ~40%: Three.js building wireframe anchor. -->
        <div class="bld-right">
          <div id="b3d" class="b3d-mount" aria-label="楼宇三维线框"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
